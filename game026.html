<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f4e9"><meta name="description" content="出世すごろく ～UP & DOWN～。ふって、すすんで、のぼったり、おりたり。時間制限なしの100マスすごろく。"><title>出世すごろく ～UP & DOWN～ | 100ガレ ～GAME100 GARAGE～</title></head><body><div id="app" data-state="title"><header><a id="portal" href="./index.html">← 100ガレへ</a><span>UP & DOWN</span><button id="mute" type="button">音 ON</button></header><main><section class="intro"><h1>出世すごろく</h1><p>ふって、すすんで、のぼったり、おりたり。</p></section><section class="play-layout"><div class="board-wrap"><svg id="board" viewBox="0 0 100 100" role="img" aria-label="1から100まで蛇行する、出世すごろくの盤面"></svg><div class="legend"><span>↑ 昇進</span><span>↓ 異動</span><span>100ぴったりでゴール</span></div></div><section class="sidebar"><div id="players" aria-label="参加者と現在地"></div><div class="dice-controls"><div id="die" aria-label="サイコロ、まだ振っていません">—</div><button id="roll" class="primary" data-game-interaction type="button">サイコロをふる</button></div><p id="turn" aria-live="polite"></p><p id="status" role="status" aria-live="polite">あなたのペースで、ひと振りずつ。</p><div class="controls"><button id="pause" type="button">休憩</button><button id="help" type="button">遊び方</button><button id="retry" type="button">やり直す</button></div></section></section><p class="note">クリック / タップ / Enter / Spaceでサイコロ。時間制限なし。<br>昇進・異動はひと振りにつき1回だけ。6でも追加ターンなし。</p></main><dialog id="menu" aria-labelledby="menu-title"></dialog><footer>100ガレ ～GAME100 GARAGE～</footer></div><script type="module" src="/src/games/game026/main.ts"></script></body></html>
