<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=contain">
<meta name="theme-color" content="#9c2a1f">
<meta name="description" content="お弁当つめつめ！ 4×4の漆塗り弁当箱へ、おかずを回して隙間なく詰めるパズル。全6弁当。">
<title>お弁当つめつめ！ ～BENTO BOX～ | 100ガレ ～GAME100 GARAGE～</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./arcade-navigation.css">
<script src="./arcade-navigation.js"></script>
</head>
<body>
<div id="app" data-screen="title">
  <header class="arcade-game-header">
    <a id="portal-link" class="arcade-portal-return" href="./index.html">← ゲーム一覧へ</a>
    <nav class="tools">
      <button id="mute" type="button" aria-pressed="false">音 ON</button>
      <button id="pause" type="button" hidden>休憩</button>
    </nav>
  </header>

  <main>
    <section id="title-screen" class="screen" aria-labelledby="title-heading">
      <div class="noren" aria-hidden="true"><img src="/assets/game037/noren.svg" alt=""><span class="noren-text"><b>お</b><b>弁</b><b>当</b></span></div>
      <h1 id="title-heading">お弁当つめつめ！<small>BENTO BOX</small></h1>
      <p class="tagline">おかずを回して、ぴったり詰める。全6弁当。</p>
      <div class="hero" id="hero" aria-hidden="true"></div>
      <div class="menu">
        <button id="start" type="button" class="primary">すぐ遊ぶ</button>
        <button id="practice-start" type="button">練習する</button>
        <button id="help-open" type="button">遊び方</button>
      </div>
      <p class="best-line">BEST <strong id="title-best">0</strong> / 6000</p>
      <p id="storage-note" class="note" hidden>この環境では記録を保存できません（ページを閉じると消えます）。</p>
    </section>

    <section id="play-screen" class="screen" hidden aria-label="弁当づくり">
      <div class="hud">
        <span id="hud-stage" class="chip">弁当 1 / 6</span>
        <span class="chip">時間 <strong id="hud-time">0</strong>秒</span>
        <span class="chip">この弁当 <strong id="hud-stage-score">1000</strong></span>
        <span class="chip" id="hud-total-wrap">合計 <strong id="hud-total">0</strong></span>
      </div>
      <div class="stage-area">
        <div class="box-wrap">
          <div class="box" id="box">
            <div class="grid" id="grid" tabindex="0" role="group" aria-label="弁当箱 4×4。おかずを選んでから矢印キーで位置を決め、Enterで詰めます。" data-game-interaction></div>
            <div class="seal" id="seal" aria-hidden="true"><img src="/assets/game037/seal-stamp.svg" alt=""><span>できあがり</span></div>
            <div class="sparkles" aria-hidden="true"><img src="/assets/game037/sparkle.svg" alt=""><img src="/assets/game037/sparkle.svg" alt=""><img src="/assets/game037/sparkle.svg" alt=""><img src="/assets/game037/sparkle.svg" alt=""><img src="/assets/game037/sparkle.svg" alt=""></div>
          </div>
        </div>
        <div class="side">
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <div class="tray" id="tray" aria-label="おかず"></div>
          <div class="actions" id="actions">
            <button id="rotate" type="button">回す ⟳<kbd>R</kbd></button>
            <button id="deselect" type="button">戻す<kbd>Esc</kbd></button>
          </div>
          <div class="clear-panel" id="clear-panel" hidden>
            <p class="clear-title" id="clear-title">できあがり！</p>
            <p class="clear-detail" id="clear-detail"></p>
            <div class="clear-buttons" id="clear-buttons"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="result-screen" class="screen" hidden aria-labelledby="result-heading">
      <h2 id="result-heading">本日の弁当 6つ、完売！</h2>
      <p class="result-total"><span>合計</span><strong id="result-total">0</strong><span>/ 6000</span></p>
      <p id="result-best" class="result-best"></p>
      <table class="result-table"><thead><tr><th>弁当</th><th>時間</th><th>回転</th><th>取外し</th><th>点</th></tr></thead><tbody id="result-rows"></tbody></table>
      <div class="menu">
        <button id="retry" type="button" class="primary">もう一度</button>
        <button id="result-title" type="button">タイトルへ</button>
      </div>
    </section>
  </main>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <form method="dialog" class="dialog-body">
      <h2 id="dialog-title"></h2>
      <div id="dialog-content"></div>
      <div class="dialog-buttons" id="dialog-buttons"></div>
    </form>
  </dialog>
  <div class="ghost" id="ghost" aria-hidden="true" hidden></div>
  <footer>100ガレ ～GAME100 GARAGE～ · BENTO BOX（試作）</footer>
</div>
<script type="module" src="/src/games/game037/main.ts"></script>
</body>
</html>
