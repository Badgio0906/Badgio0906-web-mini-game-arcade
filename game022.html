<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#285950"><meta name="description" content="一枚ずつ、すっきり。52枚のクロンダイクを、時間を気にせず。ひと息ソリティア ～KLONDIKE～。"><title>ひと息ソリティア ～KLONDIKE～ | 100ガレ</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23285950'/%3E%3Cpath d='M32 52V13M32 35Q10 34 13 18Q31 16 32 35M32 28Q49 27 50 11Q32 10 32 28' fill='none' stroke='%23e9dfbb' stroke-width='4'/%3E%3C/svg%3E"></head>
<body><div id="app" data-state="title"><header><a id="portal-link" href="./index.html">← 100ガレへ</a><div class="brand">ひと息ソリティア<small>KLONDIKE</small></div><nav><button id="mute-button" type="button">音 ON</button><button id="pause-button" type="button" disabled>休憩</button></nav></header>
<main><section class="hud" aria-label="プレイ記録"><span>組札 <b id="foundation-count">0 / 52</b></span><span>手数 <b id="move-count">0</b></span><span>時間 <b id="elapsed">0:00</b></span><span>クリア <b id="clear-count">0</b></span></section><p id="deal-caption" class="caption">時間を気にせず、ひと息。</p>
<div id="board-scroll" aria-label="カード盤面。狭い画面では左右にスクロールできます。" tabindex="0"><section id="card-board" aria-label="山札・捨て札・組札と7列の場札"></section></div>
<p id="live-status" role="status" aria-live="polite">札を選び、移動先をタップ。</p><section id="tools" class="tools" aria-label="プレイ補助"><button id="undo-button" type="button" data-game-control>戻す</button><button id="hint-button" type="button" data-game-control>ヒント</button><button id="assist-button" type="button" data-game-control>組札へ1枚</button><button id="finish-button" type="button" data-game-control>残りを整理</button><button id="drag-button" type="button" aria-pressed="false" data-game-control>指ドラッグ OFF</button><button id="help-button" type="button">説明</button><button id="restart-button" type="button">配り直す</button><button id="title-button" type="button">タイトル</button></section>
<p class="small-note">札を選ぶ → 移動先をタップ。PCはドラッグ、TabとEnterも使えます。<br>狭い画面は左右にスクロール。指ドラッグONなら札をつかんで移動できます。</p>
<dialog id="menu" aria-labelledby="menu-title"></dialog></main><footer>52枚の、静かなひと休み。<a href="./privacy.html">プライバシー</a></footer></div><script type="module" src="/src/games/game022/main.ts"></script></body></html>
