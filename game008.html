<!doctype html>
<html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><meta name="theme-color" content="#fff1d9" /><meta name="description" content="朝の街をコーヒーと歩こう。左右のバランスと液体の慣性を見て、こぼさず届ける COFFEE WALK。" /><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 17h38v24q0 15-19 15T10 41z' fill='%23fff1d9' stroke='%236b3e27' stroke-width='4'/%3E%3Cpath d='M48 22h6q12 14-6 19M20 8v-5M34 8v-5' fill='none' stroke='%236b3e27' stroke-width='4'/%3E%3C/svg%3E" /><title>コーヒーこぼすな ～COFFEE WALK～</title></head>
<body><div id="app" data-state="title" data-cups="1">
<header class="cafe-header"><button id="brand-button" class="brand" type="button" aria-label="コーヒーこぼすな タイトルに戻る"><span class="cup-mark" aria-hidden="true">☕</span><span>コーヒーこぼすな<small>COFFEE WALK</small></span></button><div class="header-actions"><span class="credit-label">CREDIT <strong id="credit-count">3</strong><span id="credit-dots" aria-hidden="true">● ● ●</span></span><button id="mute-button" type="button" aria-label="音声をミュート">音 ON</button></div></header>
<main class="morning-walk" aria-label="コーヒーこぼすな ゲーム"><div class="walk-ledger"><div class="distance-stat"><span>WALK</span><strong><b id="distance-value">0</b><small> m</small></strong></div><div><span>SCORE</span><strong id="score-value">0</strong></div><div><span>BEST</span><strong id="best-value">0</strong></div><span id="mode-label">ひとり分 · ×1</span><button id="pause-button" type="button" aria-label="一時停止" disabled>Ⅱ</button></div><div class="walk-and-receipt"><section id="stage" aria-label="朝の散歩。左右の操作で身体のバランスを取る"><div id="game-canvas"></div></section><aside id="overlay" class="cafe-receipt"></aside></div><div class="walk-caption"><span id="phase-label" role="status">急に動くと、コーヒーは遅れて揺れます。</span><span>← → / A D / 左右を押す・タップ</span></div></main>
<footer class="cafe-footer"><span>ゆっくり、でもこぼさず。</span><span>MORNING DELIVERY / 008</span></footer>
</div><script type="module" src="/src/games/game008/main.ts"></script></body></html>
