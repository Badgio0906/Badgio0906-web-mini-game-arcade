<!doctype html><html lang="ja"><meta charset="UTF-8"><title>Independent Game018 pose fixture</title><style>body{margin:0;background:#fff5d5}canvas{display:block}#stage{width:720px;height:450px}</style><canvas id="stage" width="720" height="450"></canvas><script type="module">

window.poseFixture={keys:KICK_KEYS,draw(t,swing=0,spin=0,shoe='sneaker'){const c=canvas.getContext('2d');c.lineCap='round';c.lineJoin='round';c.clearRect(0,0,720,450);c.fillStyle='#fff5d5';c.fillRect(0,0,720,450);c.strokeStyle='#887b69';c.lineWidth=2;c.beginPath();c.moveTo(0,405);c.lineTo(720,405);c.stroke();board.boy(210,262,1, swing,shoe,spin,t,false,false,false);c.fillStyle='#183746';c.font='20px sans-serif';c.fillText('Fixture t='+t.toFixed(4)+' swing='+swing+' spin='+spin,20,30);},async animate(duration){const stream=canvas.captureStream(60);const rec=new MediaRecorder(stream,{mimeType:'video/webm'}),chunks=[];rec.ondataavailable=e=>chunks.push(e.data);const done=new Promise(resolve=>rec.onstop=async()=>{const bytes=new Uint8Array(await new Blob(chunks,{type:'video/webm'}).arrayBuffer());resolve(Array.from(bytes));});rec.start();let start;await new Promise(resolve=>{function f(now){start??=now;const t=Math.min(1,(now-start)/duration);window.poseFixture.draw(t);if(t<1)requestAnimationFrame(f);else resolve();}requestAnimationFrame(f);});rec.stop();return done;}};
