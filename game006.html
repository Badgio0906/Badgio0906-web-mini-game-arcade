<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><meta name="theme-color" content="#f4ebd5" /><meta name="description" content="角度を決めて、強さを決める。2回のタイミングで小さな駐車場へ車を入れるゲーム PARK IT!。" /><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2373a99a'/%3E%3Cpath d='M20 12h24v40H20z' fill='none' stroke='%23f4ebd5' stroke-width='4'/%3E%3Cpath d='M27 23h10v12H27z' fill='%23d26951'/%3E%3C/svg%3E" /><title>ギリギリ駐車 ～PARK IT!～</title></head>
<body>
<div id="app" data-state="title" data-phase="ended" data-mode="normal">
  <header class="topbar"><button id="brand-button" class="brand" type="button" aria-label="ギリギリ駐車 タイトルに戻る"><span class="parking-mark" aria-hidden="true">P</span><span>ギリギリ駐車<small>PARK IT!</small></span></button><div class="top-actions"><span class="credits">CREDIT <strong id="credit-count">3</strong><span id="credit-dots" aria-hidden="true">● ● ●</span></span><button id="mute-button" type="button" aria-label="音声をミュート">音 ON</button></div></header>
