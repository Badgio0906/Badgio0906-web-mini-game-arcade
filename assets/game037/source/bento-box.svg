<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440">
  <!-- Game037 board: red-lacquer bento box (jubako style) with black lacquer well.
       The well is exactly x/y 20..420 so the 4x4 gameplay grid (100 units/cell) matches the art. Original hand-authored SVG. -->
  <defs>
    <linearGradient id="lacquer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2452f"/>
      <stop offset=".45" stop-color="#9c2a1f"/>
      <stop offset="1" stop-color="#6e1712"/>
    </linearGradient>
    <radialGradient id="well" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#3a2620"/>
      <stop offset=".6" stop-color="#22140f"/>
      <stop offset="1" stop-color="#140b08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d27a"/>
      <stop offset=".5" stop-color="#d9a032"/>
      <stop offset="1" stop-color="#b07a1a"/>
    </linearGradient>
    <symbol id="ume" viewBox="-12 -12 24 24">
      <g fill="url(#gold)" stroke="#7a4c0c" stroke-width=".8">
        <circle cx="0" cy="-6" r="4.6"/><circle cx="5.7" cy="-1.9" r="4.6"/><circle cx="3.5" cy="4.9" r="4.6"/><circle cx="-3.5" cy="4.9" r="4.6"/><circle cx="-5.7" cy="-1.9" r="4.6"/>
      </g>
      <circle r="2.2" fill="#9c2a1f"/>
    </symbol>
  </defs>
  <rect x="2" y="2" width="436" height="436" rx="28" fill="url(#lacquer)" stroke="#3e0b07" stroke-width="3"/>
  <rect x="9" y="9" width="422" height="422" rx="22" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <path d="M24 8 C120 4 260 4 400 10" fill="none" stroke="#ffd6c4" stroke-width="3" opacity=".35" stroke-linecap="round"/>
  <path d="M8 40 C4 140 4 260 10 380" fill="none" stroke="#ffd6c4" stroke-width="2.5" opacity=".22" stroke-linecap="round"/>
  <rect x="17" y="17" width="406" height="406" rx="8" fill="#4a0f0a"/>
  <rect x="20" y="20" width="400" height="400" rx="6" fill="url(#well)"/>
  <rect x="23" y="23" width="394" height="394" rx="5" fill="none" stroke="#000" stroke-width="6" opacity=".35"/>
  <g stroke="#4b342a" stroke-width="1.5" stroke-dasharray="3 7" stroke-linecap="round" opacity=".9">
    <path d="M120 26 L120 414"/><path d="M220 26 L220 414"/><path d="M320 26 L320 414"/>
    <path d="M26 120 L414 120"/><path d="M26 220 L414 220"/><path d="M26 320 L414 320"/>
  </g>
  <path d="M40 34 C150 28 260 30 380 40" fill="none" stroke="#7a5a4c" stroke-width="5" opacity=".25" stroke-linecap="round"/>
  <use href="#ume" x="-2" y="-2" width="24" height="24"/>
  <use href="#ume" x="418" y="-2" width="24" height="24"/>
  <use href="#ume" x="-2" y="418" width="24" height="24"/>
  <use href="#ume" x="418" y="418" width="24" height="24"/>
</svg>
